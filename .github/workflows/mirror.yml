name: WikDict dictionary mirror

# Schedule + manual only. Mirrors WikDict's CC BY-SA StarDict dictionaries
# (see README.md) into a dated Release in *this* repo -- public, so the
# Lichtung app can download assets directly with no auth and no server of
# its own in the loop. Monthly matches WikDict's own rough regeneration
# cadence -- no need to check more often than the upstream data changes.
on:
  schedule:
    - cron: "0 6 1 * *" # 1st of the month, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch current LingQ language list
        id: lingq_languages
        env:
          LINGQ_API_KEY: ${{ secrets.LINGQ_API_KEY }}
        # Re-fetched fresh every run rather than committed back to the repo
        # -- one API call, so there's nothing to gain from caching it, and
        # it means the allowlist is never more than a month stale. Falls
        # back to the checked-in static file if the secret is missing or
        # the call fails, so a LingQ-side outage degrades the mirror to
        # last month's language set instead of failing the whole job.
        run: |
          if python3 lingq_languages.py --out /tmp/languages.generated.json; then
            echo "source=lingq-api" >> "$GITHUB_OUTPUT"
            echo "path=/tmp/languages.generated.json" >> "$GITHUB_OUTPUT"
          else
            echo "LingQ language fetch failed or skipped -- falling back to the static allowlist" >&2
            echo "source=static-fallback" >> "$GITHUB_OUTPUT"
            echo "path=languages.json" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync from WikDict
        run: |
          echo "Using language allowlist source: ${{ steps.lingq_languages.outputs.source }}"
          python3 sync.py --out dist/wikdict --languages "${{ steps.lingq_languages.outputs.path }}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="wikdict-mirror-$(date -u +%Y-%m-%d)"
          gh release create "$tag" \
            --title "WikDict dictionary mirror ($(date -u +%Y-%m-%d))" \
            --notes "Mirrored from https://www.wikdict.com under CC BY-SA 4.0. See README.md. Attribution: Data from Wiktionary via DBnary, via WikDict." \
            dist/wikdict/*
